name: CI

on:
  push:
    branches: [main, m1]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Both build flavours assemble (A1.1)
        run: |
          node scripts/flavour.mjs blyg dist/blyg
          node scripts/flavour.mjs blyg-dev dist/blyg-dev
          node -e '
            const a = require("./dist/blyg/manifest.json"), b = require("./dist/blyg-dev/manifest.json");
            if (b.id !== a.id + "-dev" || b.name !== a.name + " (dev)") { console.error(a, b); process.exit(1); }
          '

  # End-to-end against a REAL local Studio (A1.3; plan §5 layer 2): tests/e2e/studio.e2e.test.ts through the plugin's own adapter, client and
  # publish service. Two legs: the PINNED release (tests/e2e/studio-pin.env) and the NEWEST release of blygger-studio. The newest leg is the one
  # that catches a Studio contract change before a user does; it fails CI only when NEWEST_MUST_PASS=true in the pin file (lane A2 sets it in A2.3).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        leg: [pinned, newest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Choose the Studio release
        id: studio
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . tests/e2e/studio-pin.env
          if [ "${{ matrix.leg }}" = "newest" ]; then
            TAG=$(gh api repos/blygger/blygger-studio/releases/latest --jq .tag_name)
            STUDIO_VERSION="${TAG#v}"
            unset STUDIO_SHA256   # read from that release's SHA256SUMS by scripts/local-studio.sh
          fi
          echo "version=$STUDIO_VERSION" >> "$GITHUB_OUTPUT"
          echo "must_pass=$([ "${{ matrix.leg }}" = "pinned" ] && echo true || echo "$NEWEST_MUST_PASS")" >> "$GITHUB_OUTPUT"
          echo "Studio ${STUDIO_VERSION} (${{ matrix.leg }})" >> "$GITHUB_STEP_SUMMARY"

      - name: Start a local Studio and run the end-to-end suite
        env:
          STUDIO_VERSION: ${{ steps.studio.outputs.version }}
          MUST_PASS: ${{ steps.studio.outputs.must_pass }}
          LEG: ${{ matrix.leg }}
        run: |
          set +e
          if [ "$LEG" = "newest" ]; then unset STUDIO_SHA256; else STUDIO_SHA256=$(sed -n 's/^STUDIO_SHA256=//p' tests/e2e/studio-pin.env); export STUDIO_SHA256; fi
          export WITH_REMOTE=1
          OUT=$(bash scripts/local-studio.sh start "$RUNNER_TEMP/studio") ; RC=$?
          if [ $RC -eq 0 ]; then
            export STUDIO_E2E_URL=$(echo "$OUT" | sed -n 's/^export STUDIO_E2E_URL=//p')
            TOKEN=$(echo "$OUT" | sed -n 's/^export STUDIO_E2E_TOKEN=//p'); echo "::add-mask::$TOKEN"; export STUDIO_E2E_TOKEN=$TOKEN
            npx vitest run tests/e2e/studio.e2e.test.ts; RC=$?
          else
            echo "$OUT" | grep -v STUDIO_E2E_TOKEN
          fi
          bash scripts/local-studio.sh stop "$RUNNER_TEMP/studio" >/dev/null 2>&1
          if [ $RC -ne 0 ] && [ "$MUST_PASS" != "true" ]; then
            echo "::warning::e2e against the $LEG Studio ($STUDIO_VERSION) FAILED but is allowed to fail until A2.3 (NEWEST_MUST_PASS=false in tests/e2e/studio-pin.env)."
            echo "**FAILED, allowed to fail** (NEWEST_MUST_PASS=false)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit $RC

  # Real Obsidian (desktop Electron under xvfb) with the fixture vault tests/fixtures/vault (A1.4; plan §5 layer 4): the built main.js loads, the panel opens,
  # a draft goes to a local Studio and the note comes back stamped, in desktop and Obsidian's phone layout (Chromium emulation, not iOS).
  # Proven on GitHub's ubuntu-latest runners (8 of 8 checks, two consecutive runs on 2026-11-04), so it is REQUIRED. If a runner image change ever breaks it
  # without a plugin change: run it in a cloud session per release candidate (docs/TESTING.md) and fix the job; do not just switch it off.
  obsidian-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/flavour.mjs blyg dist/blyg
      - run: node scripts/flavour.mjs blyg-dev dist/blyg-dev
      - name: Electron's system libraries and a virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libnss3 libgbm1 libgtk-3-0t64 libasound2t64 libxss1 libxkbcommon0
      - name: playwright-core (not a dependency of the repo; drives Obsidian over its debugging port)
        run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - uses: actions/cache@v4
        with:
          path: ~/.cache/obsidian-e2e
          key: obsidian-e2e-1.14.5
      - name: Local Studio, then the smoke test
        run: |
          OUT=$(bash scripts/local-studio.sh start "$RUNNER_TEMP/studio")
          export STUDIO_E2E_URL=$(echo "$OUT" | sed -n 's/^export STUDIO_E2E_URL=//p')
          TOKEN=$(echo "$OUT" | sed -n 's/^export STUDIO_E2E_TOKEN=//p'); echo "::add-mask::$TOKEN"; export STUDIO_E2E_TOKEN=$TOKEN
          set +e
          npm run test:obsidian; RC=$?
          bash scripts/local-studio.sh stop "$RUNNER_TEMP/studio" >/dev/null 2>&1
          exit $RC

  # P6 (docs/plans/P6-ui-regression.md, decision D3): the UI scenarios are ADVISORY for the first week (continue-on-error: a red scenario shows as a
  # warning, not a failed check), then required (remove the continue-on-error line). A scenario that passes only on its retry is reported as a warning.
  obsidian-ui:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/flavour.mjs blyg dist/blyg
      - run: node scripts/flavour.mjs blyg-dev dist/blyg-dev
      - name: Electron's system libraries and a virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libnss3 libgbm1 libgtk-3-0t64 libasound2t64 libxss1 libxkbcommon0
      - name: playwright-core (not a dependency of the repo; drives Obsidian over its debugging port)
        run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - uses: actions/cache@v4
        with:
          path: ~/.cache/obsidian-e2e
          key: obsidian-e2e-1.14.5
      - name: Local Studio, then the UI scenarios
        run: |
          OUT=$(WITH_REMOTE=1 bash scripts/local-studio.sh start "$RUNNER_TEMP/studio")
          export STUDIO_E2E_URL=$(echo "$OUT" | sed -n 's/^export STUDIO_E2E_URL=//p')
          TOKEN=$(echo "$OUT" | sed -n 's/^export STUDIO_E2E_TOKEN=//p'); echo "::add-mask::$TOKEN"; export STUDIO_E2E_TOKEN=$TOKEN
          set +e
          npm run test:obsidian:ui; RC=$?
          bash scripts/local-studio.sh stop "$RUNNER_TEMP/studio" >/dev/null 2>&1
          exit $RC

  # P6 slice E (decision D1): the same scenarios against the NEWEST public Obsidian, so a change in Obsidian shows here before it reaches a device.
  # ADVISORY and staying so (continue-on-error): the required legs run the pinned Obsidian above. A red leg here is a warning to look at, not a failure of the change.
  obsidian-ui-newest:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/flavour.mjs blyg dist/blyg
      - run: node scripts/flavour.mjs blyg-dev dist/blyg-dev
      - name: Electron's system libraries and a virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libnss3 libgbm1 libgtk-3-0t64 libasound2t64 libxss1 libxkbcommon0
      - name: playwright-core (not a dependency of the repo; drives Obsidian over its debugging port)
        run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Newest public Obsidian release
        id: obsidian
        run: |
          V=$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/repos/obsidianmd/obsidian-releases/releases/latest | sed -n 's/.*"tag_name": *"v\{0,1\}\([0-9][^"]*\)".*/\1/p' | head -1)
          if [ -z "$V" ]; then echo "::error title=Newest Obsidian::could not read the newest Obsidian release"; exit 1; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Obsidian $V (the required legs use the pinned version)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/obsidian-e2e
          key: obsidian-e2e-${{ steps.obsidian.outputs.version }}
      - name: Local Studio, then the smoke test and the UI scenarios on the newest Obsidian
        env:
          OBSIDIAN_E2E_VERSION: ${{ steps.obsidian.outputs.version }}
        run: |
          OUT=$(WITH_REMOTE=1 bash scripts/local-studio.sh start "$RUNNER_TEMP/studio")
          export STUDIO_E2E_URL=$(echo "$OUT" | sed -n 's/^export STUDIO_E2E_URL=//p')
          TOKEN=$(echo "$OUT" | sed -n 's/^export STUDIO_E2E_TOKEN=//p'); echo "::add-mask::$TOKEN"; export STUDIO_E2E_TOKEN=$TOKEN
          set +e
          npm run test:obsidian; RC1=$?
          npm run test:obsidian:ui; RC2=$?
          bash scripts/local-studio.sh stop "$RUNNER_TEMP/studio" >/dev/null 2>&1
          exit $((RC1 | RC2))
