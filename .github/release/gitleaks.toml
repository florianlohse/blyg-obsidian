# gitleaks configuration for the leak scan (the guard workflow and the release workflow).
#
# The entropy-based `generic-api-key` rule is switched off: on this tree it only ever flagged invented test constants (`const TOKEN = "..."`) and a CI cache key.
# (A path allowlist targeted at that one rule did not take effect on the runner, 2026-11-04, and could not be debugged offline; judgment: disabling the rule is the
# simpler and more predictable choice.) Every NAMED rule of gitleaks' default set (GitHub, AWS, private keys, ...) still applies everywhere, and
# scripts/public-scan.mjs additionally scans every text file for real token shapes (GitHub, AWS, Slack, private keys, JWT).
[extend]
useDefault = true
disabledRules = ["generic-api-key"]
